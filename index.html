<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL Tryout - Structure & Written Expression</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Halaman Utama (Dashboard) -->
        <div id="dashboard" class="screen active">
            <h1>Tryout TOEFL</h1>
            <p>Bahagian: Structure & Written Expression</p>
            <div class="menu">
                <button onclick="startQuiz('mini')" class="btn-primary">Pakej Mini (15 Soalan)</button>
                <button onclick="startQuiz('full')" class="btn-secondary">Pakej Simulasi Penuh</button>
            </div>
        </div>

        <!-- Mod Simulasi Kuiz -->
        <div id="quiz-area" class="screen">
            <div class="quiz-header">
                <span id="question-number">Soalan 1</span>
                <span id="timer" style="color: #ef4444;">Masa: 00:00</span>
            </div>
            
            <div class="question-container">
                <p id="question-text">Teks soalan akan dipaparkan di sini...</p>
                <div id="options-container" class="options"></div>
            </div>

            <div class="navigation">
                <button id="prev-btn" class="btn-nav" onclick="prevQuestion()">Sebelumnya</button>
                <button id="next-btn" class="btn-nav" onclick="nextQuestion()">Seterusnya</button>
                <button id="submit-btn" class="btn-primary" onclick="finishQuiz()">Selesai & Semak</button>
            </div>
        </div>

        <!-- Halaman Keputusan & Penilaian -->
        <div id="result-area" class="screen">
            <h2>Keputusan Tryout</h2>
            <div class="score-display">
                <p>Skor Anda:</p>
                <h1 id="final-score">0</h1>
                <p id="score-note" style="color: #64748b; font-size: 14px;"></p>
            </div>
            <button onclick="location.reload()" class="btn-secondary">Kembali ke Menu Utama</button>
            
            <div class="review-section">
                <h3>Penilaian Jawapan Salah:</h3>
                <div id="review-container"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
