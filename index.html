<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL Tryout - Structure & Written Expression</title>
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan font Inter untuk tampilan modern minimalis -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Halaman Awal (Dashboard) -->
        <div id="dashboard" class="screen active">
            <h1>Tryout TOEFL</h1>
            <p>Bagian: Structure & Written Expression</p>
            <div class="menu">
                <button onclick="startQuiz('mini')" class="btn-primary">Paket Mini (15 Soal)</button>
                <button onclick="startQuiz('full')" class="btn-secondary">Paket Full (40 Soal)</button>
            </div>
        </div>

        <!-- Mode Simulasi Kuis -->
        <div id="quiz-area" class="screen hidden">
            <div class="quiz-header">
                <span id="question-number">Soal 1 / 15</span>
                <span id="timer">Waktu: 15:00</span>
            </div>
            
            <div class="question-container">
                <p id="question-text">Teks soal akan muncul di sini...</p>
                <div id="options-container" class="options">
                    <!-- Tombol pilihan ganda akan di-generate oleh JavaScript -->
                </div>
            </div>

            <div class="navigation">
                <button id="prev-btn" class="btn-nav hidden" onclick="prevQuestion()">Sebelumnya</button>
                <button id="next-btn" class="btn-nav" onclick="nextQuestion()">Selanjutnya</button>
                <button id="submit-btn" class="btn-primary hidden" onclick="finishQuiz()">Selesai & Cek Nilai</button>
            </div>
        </div>

        <!-- Halaman Evaluasi & Hasil -->
        <div id="result-area" class="screen hidden">
            <h2>Hasil Tryout</h2>
            <div class="score-display">
                <p>Skor Anda:</p>
                <h1 id="final-score">0</h1>
            </div>
            <button onclick="location.reload()" class="btn-secondary">Kembali ke Menu Utama</button>
            
            <div class="review-section">
                <h3>Evaluasi Jawaban Salah:</h3>
                <div id="review-container">
                    <!-- Daftar soal salah, pembahasan, dan tombol 'Latihan Soal Sejenis' akan muncul di sini -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
